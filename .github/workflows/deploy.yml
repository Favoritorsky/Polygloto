name: Проверка и деплой

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Пока администратор не зарегистрировался, раз в час пробуем выдать ему роль.
    - cron: '17 * * * *'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: selfi-a04df
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
      - name: Сборка (без конфига, проверка компиляции)
        run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Проверка секрета
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Нет секрета FIREBASE_SERVICE_ACCOUNT (ключ сервисного аккаунта Firebase). См. README, раздел «Автоматический деплой»."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm install -g firebase-tools@15
      - name: Веб-конфиг из проекта Firebase
        run: firebase apps:sdkconfig web --project "$FIREBASE_PROJECT_ID" --json | node scripts/write-web-config.mjs
      - run: npm run build
      # Ключ Admin SDK не может читать Service Usage API, поэтому проверку
      # «включён ли API» заранее отмечаем как пройденную: на Spark все нужные
      # API (Firestore, Rules, Hosting) включены в проекте по умолчанию.
      - name: Отметка включённых API для firebase-tools
        run: |
          mkdir -p ~/.config/configstore
          node -e '
            const p = process.env.FIREBASE_PROJECT_ID;
            const apis = ["firestore.googleapis.com", "firebaserules.googleapis.com", "firebasehosting.googleapis.com", "firebase.googleapis.com"];
            const cache = { [p]: Object.fromEntries(apis.map((a) => [a, true])) };
            require("fs").writeFileSync(process.env.HOME + "/.config/configstore/firebase-tools.json", JSON.stringify({ apiEnablementCache: cache }));
          '
      - name: Деплой правил и индексов Firestore
        run: firebase deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive --force
      - name: Деплой сайта
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Назначение администратора
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/ensure-admin.mjs
      - name: Адрес сайта
        run: |
          echo "Сайт: https://$FIREBASE_PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"

  admin:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Назначение администратора
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          if [ -z "$SA" ] || [ -z "$ADMIN_EMAIL" ]; then echo "Секреты не заданы — пропускаю."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm ci
          node scripts/ensure-admin.mjs
