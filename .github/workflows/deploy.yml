name: Проверка и деплой

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: 'deploy — деплой, diagnose — только проверка настроек почты'
        default: deploy
        type: choice
        options: [deploy, diagnose]
  schedule:
    # Пока администратор не зарегистрировался, раз в час пробуем выдать ему роль.
    - cron: '17 * * * *'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: selfi-a04df
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    if: github.event_name != 'schedule' && inputs.task != 'diagnose'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
      - name: Сборка (без конфига, проверка компиляции)
        run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main' && inputs.task != 'diagnose'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Проверка секрета
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Нет секрета FIREBASE_SERVICE_ACCOUNT (ключ сервисного аккаунта Firebase). См. README, раздел «Автоматический деплой»."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm install -g firebase-tools@15
      - name: Веб-конфиг из проекта Firebase
        run: firebase apps:sdkconfig web --project "$FIREBASE_PROJECT_ID" --json | node scripts/write-web-config.mjs
      - run: npm run build
      # Деплой через REST API (не `firebase deploy`): см. комментарий в скрипте.
      - name: Деплой правил и сайта
        run: node scripts/deploy-firebase.mjs rules hosting
      # Свой SMTP включается, только если Gmail принимает логин и пароль;
      # иначе письма остаются на стандартной отправке Firebase.
      - name: Настройки писем Auth
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if python3 scripts/check-smtp.py; then export SMTP_OK=1; else export SMTP_OK=0; fi
          node scripts/configure-auth.mjs
      - name: Назначение администратора
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/ensure-admin.mjs
      - name: Адрес сайта
        run: |
          echo "Сайт: https://$FIREBASE_PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"

  admin:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Назначение администратора
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          if [ -z "$SA" ] || [ -z "$ADMIN_EMAIL" ]; then echo "Секреты не заданы — пропускаю."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm ci
          node scripts/ensure-admin.mjs

  diagnose:
    if: inputs.task == 'diagnose'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Проверка настроек почты
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm ci
          node scripts/configure-auth.mjs --diagnose
      - name: Проверка SMTP и тестовое письмо
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: python3 scripts/check-smtp.py --send || true
